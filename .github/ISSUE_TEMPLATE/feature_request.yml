name: Feature request
description: Suggest a new feature or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like MacMix to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Optional. Workarounds or other apps you have tried.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      description: Optional. Pull requests need a signed [CLA](https://github.com/ljmng7/MacMix/blob/main/CONTRIBUTING.md#contributor-license-agreement) before they can be merged.
      options:
        - label: I'd like to work on this and open a pull request.
