name: Bug report
description: Something in MacMix doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. If you can, also use **Send Feedback** in MacMix (in the panel, or under About): it creates an email with anonymized diagnostic logs, which makes audio issues much easier to track down.

        **Issues are public.** Never post your license key, order number or email address here. For license, purchase or activation problems, email jasmine@jazminli.com instead.

        MacMix requires macOS 14.4 or later.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you report
      options:
        - label: I searched the existing issues and didn't find this problem.
          required: true
        - label: I'm on the latest MacMix release, or I built from the latest `main`.
          required: true
  - type: input
    id: macmix-version
    attributes:
      label: MacMix version and build
      description: Shown in About, as version (build).
      placeholder: "2.3.7 (34)"
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edition and channel
      options:
        - Official download, Free
        - Official download, Studio (stable releases)
        - Official download, Studio (Beta channel)
        - Built from source
    validations:
      required: true
  - type: input
    id: xcode-version
    attributes:
      label: Xcode version (if built from source)
      description: Version and build, from Xcode › About Xcode or `xcodebuild -version`.
      placeholder: "Xcode 26.3, build …"
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "macOS 26.1"
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Mac chip
      options:
        - Apple silicon (M-series)
        - Intel
    validations:
      required: true
  - type: input
    id: mac-model
    attributes:
      label: Mac model
      placeholder: "MacBook Air (M2, 2022)"
  - type: textarea
    id: devices
    attributes:
      label: Audio devices involved
      description: Output and input devices, such as AirPods, displays, AirPlay speakers or audio interfaces.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or logs
      description: Optional. Before attaching, remove anything private, including license keys, order numbers and email addresses.
